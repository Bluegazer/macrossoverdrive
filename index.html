<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Macross VOXP Web - Modular</title>
  <style>
    @font-face {
      font-family: 'Conthrax';
      src: url('./fonts/conthrax-sb.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * { font-family: 'Conthrax', sans-serif; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #050811; color: white; user-select: none; }
    #hudCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    #ui { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(6, 12, 24, 0.82); padding: 14px; border-radius: 6px; border: 1px solid #1e3a5f; width: 375px; }
    .btn-group { display: flex; gap: 6px; margin-bottom: 8px; }
    button { flex: 1; background: #0f172a; color: #cbd5e1; border: 1px solid #334155; padding: 7px 4px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 9.5px; letter-spacing: 0.5px; }
    button:hover { background: #1e293b; }
    button.active { background: #1d4ed8; border-color: #38bdf8; color: white; }
    button.warn { border-color: #d97706; color: #fbbf24; }
    .hud-box { background: rgba(2, 6, 23, 0.9); padding: 9px; border-radius: 4px; font-size: 10px; border-left: 3px solid #22c55e; margin-top: 6px; line-height: 1.7; color: #86efac; }
    .controls-help { font-size: 8.5px; color: #94a3b8; margin-top: 8px; line-height: 1.55; }
    #fpsBox { position: absolute; bottom: 15px; right: 15px; z-index: 10; background: rgba(2, 6, 23, 0.88); padding: 8px 14px; border-radius: 6px; border: 1px solid #1e3a5f; font-size: 12px; font-weight: bold; color: #4ade80; letter-spacing: 0.8px; }
  </style>
  <script src="./three.min.js"></script>
  <script src="./GLTFLoader.js"></script>
</head>
<body>
  <canvas id="hudCanvas"></canvas>
  <div id="ui">
    <h3 style="margin: 0 0 8px 0; color: #38bdf8; font-size: 12px; letter-spacing: 0.8px;">VF-1A // DYRL FIRE CONTROL</h3>
    <div class="btn-group">
      <button id="btnFighter" class="active">(F) FIGHTER</button>
      <button id="btnGerwalk">(G) GERWALK</button>
      <button id="btnBattroid">(B) BATTROID</button>
    </div>
        <div class="btn-group">
      <button id="btnSweep">(T) TURBO</button>
      <button id="btnStop" class="warn">(X) FULL STOP</button>
      <button id="btnMelee">(E) GOLPE</button>
    </div>
    <div class="hud-box" id="hud">INICIANDO SISTEMAS...</div>
    <div class="controls-help">
      <b>BATTROID (B) / GERWALK (G):</b> W/S AVANCE | A/D LATERAL<br>
      <b>FLECHAS IZQ/DER:</b> GIRAR | <b>ARR/ABJ:</b> SUBIR/BAJAR<br>
      <b>FIGHTER (F):</b> W/S THROTTLE | A/D YAW | FLECHAS ROLL/PITCH<br>
      <b>R:</b> REVERSA GERWALK | <b>X:</b> STOP | <b>T:</b> TURBO<br>
      <b>SHIFT IZQ:</b> GUNPOD | <b>ESPACIO:</b> MISILES GUIADOS

    </div>
  </div>
  <div id="fpsBox">FPS: 60</div>

  <script src="./js/hud.js"></script>
  <script src="./js/weapons.js"></script>
  <script src="./js/player.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/audio.js"></script>
</body>
</html>
